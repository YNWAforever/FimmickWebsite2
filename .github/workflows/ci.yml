name: CI

# Quality gate for every pull request and for main. Indexability is baked in at build time, so the
# production build is checked from its output (robots, noindex, canonicals) before anything else
# can be trusted; the end-to-end suite then runs against a review build, which is what previews
# serve and what its noindex assertions describe.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests, then the Simplified Chinese table and caption check (both in npm test since 8.3).
      - run: npm test

      - name: Production build
        run: npx next build
        env:
          SITE_ENV: production
      - name: Production build is indexable
        run: node scripts/award-2/assert-production-build.mjs

      - name: Review build (what previews serve)
        run: npx next build
      - name: Simplified Chinese pages carry no unmarked Traditional text
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/en && break; sleep 1; done
          node scripts/i18n/check-hans.mjs
          kill %1
          wait %1 || true
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      # Chromium runs every spec (axe, cascade, craft …); Firefox, WebKit, iPhone 14 and iPad landscape
      # run the smoke set (playwright.config.ts).
      - name: End-to-end, accessibility and craft tests
        run: npx playwright test
      # Lighthouse mobile /en, median of 5 (10 when under the floor), against the CI baseline in
      # docs/redesign/award-2/quality-baseline.json: fails on a drop of more than 2 points.
      - name: Lighthouse gate
        run: node scripts/award-2/quality-gate.mjs --only=lighthouse --env=ci --no-write
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
